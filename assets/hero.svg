<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0e" />
      <stop offset="100%" stop-color="#0d131a" />
    </linearGradient>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1118" />
      <stop offset="100%" stop-color="#06090d" />
    </linearGradient>
    <filter id="radarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="520" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Grid -->
  <g stroke="#1e293b" stroke-width="0.75" stroke-dasharray="4 8" opacity="0.3">
    <line x1="60" y1="80" x2="1140" y2="80" />
    <line x1="60" y1="200" x2="1140" y2="200" />
    <line x1="60" y1="360" x2="1140" y2="360" />
    <line x1="240" y1="40" x2="240" y2="480" />
    <line x1="560" y1="40" x2="560" y2="480" />
    <line x1="880" y1="40" x2="880" y2="480" />
  </g>

  <!-- LEFT: Title, Value Proposition & Metrics -->
  <g transform="translate(64, 56)">
    <!-- Context Badge -->
    <rect x="0" y="0" width="162" height="24" rx="4" fill="#082319" stroke="#10b981" stroke-width="0.9" />
    <circle cx="12" cy="12" r="3.5" fill="#10b981" filter="url(#radarGlow)" />
    <text x="24" y="16" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="1">PRE-FLIGHT HUD</text>

    <!-- Main Title -->
    <text x="0" y="72" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">dev-context</text>

    <!-- Subtitle / Hook -->
    <text x="0" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">Context recovery &amp; task queue for CLI coding agents.</text>
    <text x="0" y="136" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Zero blank-line paralysis before agy, claude, or codex starts.</text>

    <!-- Radar Graphic (Small Emblem) -->
    <g transform="translate(48, 220)">
      <circle r="44" fill="none" stroke="#1e293b" stroke-width="1" />
      <circle r="30" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3" />
      <circle r="16" fill="#0b1720" stroke="#0284c7" stroke-width="1.5" />
      <line x1="-50" y1="0" x2="50" y2="0" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
      <line x1="0" y1="-50" x2="0" y2="50" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
      <circle cx="20" cy="-14" r="3" fill="#10b981" filter="url(#radarGlow)" />
      <path d="M 0 0 L 24 -18 A 30 30 0 0 1 30 0 Z" fill="#38bdf8" opacity="0.25" />
      <circle r="3" fill="#38bdf8" />
    </g>

    <!-- Supported Agents Row -->
    <g transform="translate(120, 192)">
      <text x="0" y="0" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="12" font-weight="600">NATIVE HOOKS</text>
      <text x="0" y="22" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12">Antigravity (agy)</text>
      <text x="0" y="40" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12">Claude Code (claude)</text>
      <text x="0" y="58" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12">OpenAI Codex (codex)</text>
    </g>

    <!-- Spec Badges Row -->
    <g transform="translate(0, 340)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="108" height="42" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="18" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="14" font-weight="700">&lt; 350ms</text>
      <text x="14" y="32" fill="#64748b" font-family="ui-monospace, monospace" font-size="9.5">SCAN TIME</text>

      <!-- Metric 2 -->
      <rect x="118" y="0" width="108" height="42" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="132" y="18" fill="#10b981" font-family="ui-monospace, monospace" font-size="14" font-weight="700">ZERO</text>
      <text x="132" y="32" fill="#64748b" font-family="ui-monospace, monospace" font-size="9.5">DEPENDENCIES</text>

      <!-- Metric 3 -->
      <rect x="236" y="0" width="108" height="42" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="250" y="18" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="14" font-weight="700">dc</text>
      <text x="250" y="32" fill="#64748b" font-family="ui-monospace, monospace" font-size="9.5">2-LETTER CLI</text>

      <!-- Metric 4 -->
      <rect x="354" y="0" width="108" height="42" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="368" y="18" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="14" font-weight="700">GIT</text>
      <text x="368" y="32" fill="#64748b" font-family="ui-monospace, monospace" font-size="9.5">NATIVE SYNC</text>
    </g>
  </g>

  <!-- RIGHT: Real Terminal Flight Readout Window -->
  <g transform="translate(560, 44)">
    <!-- Terminal Box -->
    <rect width="576" height="432" rx="10" fill="url(#termBg)" stroke="#334155" stroke-width="1" />

    <!-- Terminal Window Bar -->
    <rect width="576" height="34" rx="10" fill="#111827" />
    <rect y="24" width="576" height="10" fill="#111827" />
    <line x1="0" y1="34" x2="576" y2="34" stroke="#1e293b" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="20" cy="17" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="36" cy="17" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="52" cy="17" r="4.5" fill="#10b981" opacity="0.8" />
    <text x="288" y="21" fill="#64748b" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">terminal - dev-context pre-flight</text>

    <!-- Terminal Code & HUD Content -->
    <g transform="translate(20, 56)" font-family="ui-monospace, 'Cascadia Code', Menlo, monospace" font-size="11.5">
      <!-- Prompt invocation -->
      <text x="0" y="0" fill="#64748b">$ <tspan fill="#38bdf8" font-weight="600">claude</tspan></text>

      <!-- Flight header -->
      <text x="0" y="24" fill="#f8fafc" font-weight="700">─── DEV FLIGHT CONTEXT ───</text>

      <!-- Current repo -->
      <text x="0" y="48" fill="#38bdf8" font-weight="600">📍 laya-file-organizer <tspan fill="#94a3b8" font-weight="400">(master)</tspan> <tspan fill="#10b981" font-weight="700">[CLEAN]</tspan></text>
      <text x="14" y="66" fill="#64748b">Last commit (35m ago): feat: add pyproject.toml</text>

      <!-- In progress work -->
      <text x="0" y="98" fill="#f59e0b" font-weight="700">⚡ In-Progress / Uncommitted Work:</text>
      <text x="14" y="118" fill="#e2e8f0">• <tspan font-weight="700">why</tspan> <tspan fill="#f59e0b">(3 modified)</tspan> <tspan fill="#64748b">— 38m ago: feat: live links</tspan></text>
      <text x="14" y="136" fill="#e2e8f0">• <tspan font-weight="700">RF-FMNN</tspan> <tspan fill="#f59e0b">(14 modified)</tspan> <tspan fill="#64748b">— 2d ago: perf: vectorize batch</tspan></text>
      <text x="14" y="154" fill="#e2e8f0">• <tspan font-weight="700">aislop</tspan> <tspan fill="#f59e0b">(1 modified)</tspan> <tspan fill="#64748b">— 7w ago: release: 0.17.0</tspan></text>

      <!-- Recent repos -->
      <text x="0" y="186" fill="#38bdf8" font-weight="700">🕒 Recent Activity:</text>
      <text x="14" y="206" fill="#94a3b8">• prism                7m ago   -> global vs local</text>
      <text x="14" y="224" fill="#94a3b8">• TradePilot          11m ago   -> add maven wrap</text>

      <!-- Roadmap queue -->
      <text x="0" y="256" fill="#10b981" font-weight="700">📋 Focus Queue (ROADMAP.md):</text>
      <text x="14" y="276" fill="#34d399">## Active Sprint</text>
      <text x="14" y="294" fill="#f8fafc"><tspan fill="#38bdf8" font-weight="700">[1]</tspan> laya: folder preview before move</text>
      <text x="14" y="312" fill="#f8fafc"><tspan fill="#38bdf8" font-weight="700">[2]</tspan> spotify-roaster: cache auth token</text>

      <!-- Divider & Agent prompt -->
      <text x="0" y="336" fill="#334155">─────────────────────────────────────────────────</text>
      <text x="0" y="358" fill="#10b981" font-weight="600">&gt; Claude Code initialized. Ready for instructions.</text>
    </g>
  </g>
</svg>
