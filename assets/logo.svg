<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f14" />
      <stop offset="100%" stop-color="#050709" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid lines (subtle) -->
  <g stroke="#1e293b" stroke-width="0.75" stroke-dasharray="4 6" opacity="0.4">
    <line x1="40" y1="70" x2="760" y2="70" />
    <line x1="40" y1="140" x2="760" y2="140" />
    <line x1="40" y1="210" x2="760" y2="210" />
    <line x1="160" y1="20" x2="160" y2="260" />
    <line x1="400" y1="20" x2="400" y2="260" />
    <line x1="640" y1="20" x2="640" y2="260" />
  </g>

  <!-- Left Emblem: Radar / Target Scanner -->
  <g transform="translate(100, 140)">
    <!-- Radar concentric rings -->
    <circle r="72" fill="none" stroke="#1e293b" stroke-width="1" />
    <circle r="52" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3" />
    <circle r="34" fill="#0b1720" stroke="#0284c7" stroke-width="1.5" opacity="0.7" />
    
    <!-- Radar sweep arc -->
    <path d="M 0 0 L 36 -28 A 46 46 0 0 1 50 8 Z" fill="#38bdf8" opacity="0.18" />

    <!-- Crosshairs -->
    <line x1="-78" y1="0" x2="78" y2="0" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="-78" x2="0" y2="78" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Outer targeting brackets -->
    <path d="M -54 -36 L -66 -36 L -66 -20" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 54 -36 L 66 -36 L 66 -20" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -54 36 L -66 36 L -66 20" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 54 36 L 66 36 L 66 20" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Central ping and beacon -->
    <circle r="14" fill="#0369a1" opacity="0.4" filter="url(#glow)" />
    <circle r="5" fill="#38bdf8" />
    
    <!-- Active blip -->
    <circle cx="34" cy="-24" r="3.5" fill="#10b981" filter="url(#glow)" />
  </g>

  <!-- Typography & Content -->
  <g transform="translate(225, 0)">
    <!-- Category Tag -->
    <rect x="0" y="58" width="138" height="22" rx="4" fill="#0f291e" stroke="#10b981" stroke-width="0.8" opacity="0.9" />
    <circle cx="12" cy="69" r="3.5" fill="#10b981" />
    <text x="24" y="73" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" letter-spacing="1">PRE-FLIGHT HUD</text>

    <!-- Main Title -->
    <text x="0" y="128" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">dev-context</text>

    <!-- Subtitle -->
    <text x="0" y="162" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Context recovery and flight check for CLI coding agents</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 196)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="12" y="17" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11" font-weight="500">⚡ Dirty Repos</text>

      <!-- Pill 2 -->
      <rect x="120" y="0" width="124" height="26" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="132" y="17" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11" font-weight="500">🕒 Recent Work</text>

      <!-- Pill 3 -->
      <rect x="254" y="0" width="116" height="26" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="266" y="17" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11" font-weight="500">📋 Focus Queue</text>

      <!-- Pill 4 -->
      <rect x="380" y="0" width="100" height="26" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="392" y="17" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11" font-weight="500">&lt; 350ms</text>
    </g>
  </g>
</svg>
