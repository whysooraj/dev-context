[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-context"
version = "1.0.0"
description = "Local-first development context engine and stdio MCP server for coding agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "whysooraj" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "coding-agents",
    "claude-code",
    "cursor",
    "context-engine",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/whysooraj/dev-context"
Repository = "https://github.com/whysooraj/dev-context"
Issues = "https://github.com/whysooraj/dev-context/issues"

[project.scripts]
dev-context-mcp = "dev_context_mcp:main"

[tool.setuptools]
py-modules = ["dev_context", "dev_context_mcp"]
